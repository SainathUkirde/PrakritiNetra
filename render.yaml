services:
  # ── Streamlit dashboard — full-feature app.py (Plotly maps, all 5 features) ──
  # This is the primary deployed service. It runs app.py directly on Render,
  # identical to the Streamlit Cloud deployment — same Plotly heatmaps, hover,
  # sector blending, confidence scores, alerts, feedback loop, weight maps.
  - type: web
    name: prakriti-netra-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: USE_SYNTHETIC
        value: "1"
    healthCheckPath: /

  # ── FastAPI backend — only needed if you use the React/Vercel frontend ────────
  # You can ignore this service if you only use the Streamlit dashboard above.
  - type: web
    name: prakriti-netra-api
    runtime: python
    buildCommand: pip install -r requirements-api.txt
    startCommand: uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: USE_SYNTHETIC
        value: "1"
    healthCheckPath: /
